<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Seguridad Uruguay</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="map"></div>

    <div class="hud-container">
        <div class="glass-panel">
            <h1>Monitor de Seguridad</h1>
            <p class="subtitle">Datos en tiempo real - Uruguay</p>

            <div class="stats-row">
                <div class="stat-item">
                    <span class="stat-label">Total Casos</span>
                    <span class="stat-value" id="total-cases">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Actualización</span>
                    <span class="stat-value" id="last-update">--:--</span>
                </div>
            </div>

            <div class="legend">
                <div class="gradient-bar"></div>
                <div class="legend-labels">
                    <span>Baja</span>
                    <span>Media</span>
                    <span>Alta</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Panel Derecha Wrapper -->
    <div class="right-panel-container">
        <!-- Ranking -->
        <div class="glass-panel ranking-panel">
            <h3
                style="margin-top:0; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:5px; font-size:1rem;">
                📉 Zonas Críticas</h3>
            <ul id="ranking-list" style="list-style:none; padding:0; margin:0;"></ul>
        </div>

        <!-- Demografía -->
        <div class="glass-panel demographics-panel">
            <h3
                style="margin-top:0; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:5px; font-size:1rem;">
                👥 Víctimas</h3>
            <div class="demo-grid">
                <div class="demo-item">
                    <span class="demo-label">Hombres</span>
                    <span id="count-men" class="demo-value">0</span>
                </div>
                <div class="demo-item">
                    <span class="demo-label">Mujeres</span>
                    <span id="count-women" class="demo-value">0</span>
                </div>
                <div class="demo-item">
                    <span class="demo-label">Menores</span>
                    <span id="count-minors" class="demo-value">0</span>
                </div>
            </div>
        </div>
    </div>

    <div id="tooltip" class="custom-tooltip" style="display: none;"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <script src="script.js"></script>
</body>

</html>
